[package]
name = "calendo"
version = "0.7.1"
description = "A menu bar calendar for macOS"
authors = ["Vipin Yadav"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "calendo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2 = "0.6"
window-vibrancy = "0.6"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-event-kit = "0.3.2"
objc2-app-kit = { version = "0.3.2", features = ["NSBox", "NSButton", "NSButtonCell", "NSCell", "NSColor", "NSEvent", "NSResponder", "NSStatusBarButton", "NSStatusItem", "NSView", "NSVisualEffectView", "NSWindow", "block2", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }
objc2-foundation = "0.3.2"
block2 = "0.6"

# The macOS 27 toolchain's `strip` corrupts proc-macro dylibs when the
# deployment target is 13.0, which `tauri build` sets: dyld rejects them with
# "mis-aligned LINKEDIT string pool" and rustc reports "can't find crate for
# serde_derive". Proc-macros only run at compile time and never ship, so they
# skip stripping; the app binary is still stripped.
[profile.release.build-override]
strip = "none"
